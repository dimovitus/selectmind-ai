[package]
name = "selectmind-desktop"
version = "0.2.0"
description = "SelectMind AI desktop shell"
authors = ["SelectMind"]
edition = "2021"

[lib]
name = "selectmind_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
mouse_position = "0.1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
urlencoding = "2"
leptess = "0.14"

# xcap's Linux build hard-depends on pipewire/libspa, which does not compile
# against PipeWire >= 1.4 headers. Linux uses the xdg-desktop-portal backend.
[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
arboard = "3"
zbus = "5"
gtk = "0.18"
gdk = "0.18"
# Continuous capture: portal ScreenCast fd → GStreamer pipewiresrc (no direct libpipewire).
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[target.'cfg(windows)'.dependencies.uiautomation]
version = "0.24"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
